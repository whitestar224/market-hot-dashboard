# requirements.lock —— 精确锁定版本（可复现部署）
#
# 生成方式：在【生产运行环境】C:/Python314 下 `pip freeze` 后筛选出
# requirements.txt 声明依赖的完整传递闭包。
#
# 用途：
#   1. 部署/回滚时用 `pip install -r requirements.lock` 精确复现已验证的版本组合。
#   2. 排查「升级某库后行为改变」时作为基线对照。
#
# 与 requirements.txt 的关系：requirements.txt 是【约束声明】（版本区间），
# 本文件是【冻结快照】（精确版本）。日常开发以 requirements.txt 为准，
# 上线/回滚以本文件为准。两者定期同步。
#
# 注意：
#   - 本机为 Windows + Python 3.14，uiautomation / rapidocr 是 Windows-only
#     可选依赖（OCR 桌面识别），Linux 部署时跳过。
#   - 已知无害告警：requests 2.32.5 会对 chardet 7.x 报 RequestsDependencyWarning
#     （requests 内部版本校验不认识极新的 chardet），不影响功能，勿动。
#
# 快照时间：2026-09-29
# 环境：CPython 3.14.3 (Windows)

